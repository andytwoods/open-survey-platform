[project]
name = "osp-store"
version = "0.0.0"
description = "Open Survey Platform: osp-store (layer L4)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16,<2",
    "cryptography>=45,<51",
    "pg8000>=1.31,<2",
    "sqlalchemy>=2.0,<2.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

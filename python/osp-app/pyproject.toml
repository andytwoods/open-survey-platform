[project]
name = "osp-app"
version = "0.0.0"
description = "Open Survey Platform: osp-app (layer L5)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "osp-ops",
    "osp-spec",
    "osp-store",
    "osp-targets",
]

[tool.uv.sources]
osp-ops = { workspace = true }
osp-spec = { workspace = true }
osp-store = { workspace = true }
osp-targets = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

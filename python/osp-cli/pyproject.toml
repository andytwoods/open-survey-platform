[project]
name = "osp-cli"
version = "0.0.0"
description = "Open Survey Platform: osp-cli (layer L6)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "osp-app",
    "osp-runtime",
    "osp-store",
]

[project.scripts]
osp-cli = "osp_cli.main:main"

[tool.uv.sources]
osp-app = { workspace = true }
osp-runtime = { workspace = true }
osp-store = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "osp-api"
version = "0.0.0"
description = "Open Survey Platform: osp-api (layer L6)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140,<0.144",
    "osp-app",
    "osp-expr",
    "osp-host-signing",
    "osp-ops",
    "osp-runtime",
    "osp-spec",
    "osp-store",
    "osp-targets",
    "uvicorn>=0.35,<1",
]

[project.scripts]
osp-api = "osp_api.serve:main"

[tool.uv.sources]
osp-app = { workspace = true }
osp-expr = { workspace = true }
osp-host-signing = { workspace = true }
osp-ops = { workspace = true }
osp-spec = { workspace = true }
osp-runtime = { workspace = true }
osp-store = { workspace = true }
osp-targets = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

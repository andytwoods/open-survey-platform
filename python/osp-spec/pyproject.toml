[project]
name = "osp-spec"
version = "0.0.0"
description = "Open Survey Platform: osp-spec (layer L1)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "osp-expr",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
# Test-only (MPL-2.0 is allowed for dev/test dependencies, licence-policy.toml).
dev = ["hypothesis>=6.140,<7"]

[tool.uv.sources]
osp-expr = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

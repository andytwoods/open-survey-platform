# Property schema for pages (planning/builder-design.md §1).
type: page
entity: page
label: { en: "Page" }
icon: file
properties:
  title:
    kind: text
    label: { en: "Title" }
    translatable: true
    group: Basics
    help: { en: "An optional heading shown above the page's questions." }
  showIf:
    kind: condition
    label: { en: "Show page if" }
    group: Logic
    help: { en: "Show the page only when this condition is true; otherwise it is skipped and its questions are not asked. May refer only to earlier pages." }
  itemOrder:
    kind: enum
    label: { en: "Question order" }
    options:
      - { value: fixed, label: { en: "As listed" } }
      - { value: shuffle, label: { en: "Shuffle per participant" } }
    default: fixed
    group: Basics
    help: { en: "The realised order is fixed the first time a participant reaches the page." }
hidden:
  source: "Question-bank provenance (planning/question-bank.md §2.3): written only when a bank item is inserted, removed with clear_source; shown as the provenance line, never edited in the panel."
  id: "Stable identity; assigned when the page is added, never edited in the panel."
  items: "Questions are edited on the canvas and in the outline tree, not in the property panel."

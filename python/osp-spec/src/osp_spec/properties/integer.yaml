# Property schema for `integer` questions (planning/builder-design.md §1).
type: integer
entity: question
family: number
label: { en: "Whole number" }
icon: hash
properties:
  label:
    kind: richtext
    rich: stem
    label: { en: "Question text" }
    translatable: true
    required: true
    default: "Untitled question"
    group: Basics
    help: { en: "What participants see. Use ${id} to pipe in an earlier answer." }
  help:
    kind: richtext
    rich: stem
    label: { en: "Help text" }
    translatable: true
    group: Basics
    help: { en: "Shown under the question text." }
  showIf:
    kind: condition
    label: { en: "Show if" }
    group: Logic
    help: { en: "Show the question only when this condition is true. Always shown when empty." }
  required:
    kind: bool
    label: { en: "Required" }
    default: false
    group: Validation
    help: { en: "Participants must answer before continuing. Only enforced while the question is shown." }
  min:
    kind: number
    label: { en: "Minimum" }
    group: Validation
    help: { en: "The smallest answer allowed (inclusive). Checked only when answered." }
  max:
    kind: number
    label: { en: "Maximum" }
    group: Validation
    help: { en: "The largest answer allowed (inclusive). Checked only when answered." }
  constraint:
    kind: condition
    label: { en: "Constraint" }
    group: Validation
    help: { en: "A condition an answer must satisfy. Checked only on answered values." }
  constraintMessage:
    kind: text
    rich: inline
    label: { en: "Constraint message" }
    translatable: true
    group: Validation
    help: { en: "Shown when the constraint fails." }
  name:
    kind: text
    label: { en: "Variable name" }
    group: Advanced
    help: { en: "The column name in data exports and codebooks. Defaults to the id." }
hidden:
  source: "Question-bank provenance (planning/question-bank.md §2.3): written only when a bank item is inserted, removed with clear_source; shown as the provenance line, never edited in the panel."
  id: "Stable identity used by every reference; assigned when the question is added, never edited in the panel."
  type: "The discriminator; changing type is its own op, not a property edit."
  custom: "The lab's own properties (planning/property-profiles.md): defined by the lab panel profile and edited through its custom fields with the set_custom_property op, never as one object."

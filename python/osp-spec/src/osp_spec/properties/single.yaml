# Property schema for `single` questions (planning/builder-design.md §1).
type: single
entity: question
family: choice
label: { en: "Single choice" }
icon: circle-dot
properties:
  label:
    kind: richtext
    label: { en: "Question text" }
    translatable: true
    required: true
    default: "Untitled question"
    group: Basics
    help: { en: "What participants see. Use ${id} to pipe in an earlier answer." }
  help:
    kind: richtext
    label: { en: "Help text" }
    translatable: true
    group: Basics
    help: { en: "Shown under the question text." }
  choices:
    kind: choicelist
    label: { en: "Choices" }
    translatable: true
    default:
      - { value: 1, label: "Option 1" }
      - { value: 2, label: "Option 2" }
    group: Choices
    help: { en: "Codes and labels. The code is what is stored in the data." }
  choiceOrder:
    kind: enum
    label: { en: "Choice order" }
    options:
      - { value: fixed, label: { en: "As listed" } }
      - { value: shuffle, label: { en: "Shuffle per participant" } }
    default: fixed
    group: Choices
    help: { en: "Shuffled orders are seeded, so each participant keeps theirs." }
  showIf:
    kind: condition
    label: { en: "Show if" }
    group: Logic
    help: { en: "Show the question only when this condition is true. Always shown when empty." }
  required:
    kind: bool
    label: { en: "Required" }
    default: false
    group: Validation
    help: { en: "Participants must answer before continuing. Only enforced while the question is shown." }
  constraint:
    kind: condition
    label: { en: "Constraint" }
    group: Validation
    help: { en: "A condition an answer must satisfy. Checked only on answered values." }
  constraintMessage:
    kind: text
    label: { en: "Constraint message" }
    translatable: true
    group: Validation
    help: { en: "Shown when the constraint fails." }
  name:
    kind: text
    label: { en: "Variable name" }
    group: Advanced
    help: { en: "The column name in data exports and codebooks. Defaults to the id." }
hidden:
  id: "Stable identity used by every reference; assigned when the question is added, never edited in the panel."
  type: "The discriminator; changing type is its own op, not a property edit."
  choiceList: "Edited through the choices editor, which switches between inline choices and a shared list (exactly one is set)."

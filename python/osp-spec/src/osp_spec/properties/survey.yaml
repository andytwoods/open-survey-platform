# Property schema for survey settings (planning/builder-design.md §1).
# Dotted keys reach into nested objects: `metadata.title` is Survey.metadata.title.
type: survey
entity: survey
label: { en: "Survey settings" }
icon: settings
properties:
  metadata.title:
    kind: text
    label: { en: "Title" }
    translatable: true
    required: true
    default: "Untitled survey"
    group: Basics
  metadata.description:
    kind: richtext
    label: { en: "Description" }
    translatable: true
    group: Basics
  metadata.defaultLanguage:
    kind: enum
    label: { en: "Default language" }
    optionsFrom: metadata.languages
    group: Basics
    help: { en: "The language participants see first. The first survey language when empty." }
  settings.backNavigation:
    kind: bool
    label: { en: "Allow going back" }
    default: true
    group: Basics
    help: { en: "Participants can return to earlier pages and change answers." }
  settings.saveMode:
    kind: enum
    label: { en: "Saving" }
    options:
      - { value: every-page, label: { en: "Save to the server on every page" } }
      - { value: end-only, label: { en: "Send nothing until the end" } }
    default: every-page
    group: Advanced
    help: { en: "End-only keeps answers on the participant's device until they submit: drop-outs leave no data." }
  settings.localCopy:
    kind: enum
    label: { en: "Copy kept on the device (end-only)" }
    options:
      - { value: browser, label: { en: "Browser storage" } }
      - { value: memory, label: { en: "Memory only" } }
    default: browser
    group: Advanced
    help: { en: "With memory only, refreshing the page restarts the survey (same conditions and order)." }
  settings.resumeExpiryDays:
    kind: number
    label: { en: "Resume link expires after (days)" }
    default: 30
    group: Advanced
    help: { en: "Days without activity after which a participant can no longer resume." }
  metadata.license:
    kind: text
    label: { en: "Licence" }
    group: Advanced
    help: { en: "Licence of the questionnaire itself, e.g. CC-BY-4.0." }
hidden:
  metadata.instruments: "The instruments used, derived from the questions' bank sources at publish (question-bank.md lead decision 1); never edited by hand."
  settings.retention: "Chosen in Survey settings (options from /api/meta/retention); publishing is refused until it is set."
  consent: "Edited in Survey settings (Consent section, the set_consent op): text per language, button labels, decline counting."
  settings.theme: "Set in the Appearance view (Use for this survey); a full copy of the theme."
  hooks: "Edited in Survey settings (Researcher hooks section, the set_hooks op): the script, the handled events and what each reads; redirects and parent messages in the JSON view."
  specVersion: "Format version, written by the platform."
  id: "Stable survey identity, assigned at creation."
  version: "Published version number, set by publishing."
  metadata.languages: "Edited in Survey settings and the translation grid (the set_languages op)."
  metadata.ddi: "Free-form DDI study metadata; edited in the JSON view."
  choiceLists: "Shared lists are edited in the choice list editor."
  variables: "Edited in the flow editor and variables view."
  blocks: "Edited in the outline tree."
  quotas: "Edited in the flow editor."
  flow: "Edited in the flow editor."

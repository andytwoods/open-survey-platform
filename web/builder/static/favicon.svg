<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
	<title>Open Survey Platform</title>
	<style>
		.tile { fill: #2456c7; }
		.ink { fill: #ffffff; }
		.ring { fill: none; stroke: #ffffff; stroke-width: 3.5; }
		@media (prefers-color-scheme: dark) {
			.tile { fill: #8fb0ff; }
			.ink { fill: #0b1220; }
			.ring { stroke: #0b1220; }
		}
	</style>
	<rect class="tile" width="64" height="64" rx="14" />
	<circle class="ring" cx="19" cy="21" r="7" />
	<circle class="ink" cx="19" cy="21" r="3" />
	<rect class="ink" x="31" y="18" width="21" height="6" rx="3" />
	<circle class="ring" cx="19" cy="43" r="7" />
	<rect class="ink" x="31" y="40" width="14" height="6" rx="3" />
</svg>
